
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADRIX AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:white}
header{padding:18px;background:#111a30;border-bottom:1px solid #27334d;display:flex;align-items:center;gap:12px}
.logo{background:#2563eb;border-radius:14px;padding:10px;font-weight:bold;font-size:20px}
header h2{margin:0;font-size:21px}
header p{margin:4px 0 0;color:#a7b4cc;font-size:12px}
#chat{height:calc(100dvh - 155px);overflow-y:auto;padding:18px}
.welcome{text-align:center;margin:14vh auto 25px;max-width:330px}
.brain{font-size:48px}
.welcome h1{font-size:28px;margin-bottom:8px}
.welcome p{color:#a7b4cc;line-height:1.6}
.message{padding:13px 15px;border-radius:16px;margin:12px 0;max-width:88%;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}
.user{background:#2458c6;margin-left:auto}
.ai{background:#172239;border:1px solid #2a3853;margin-right:auto}
form{position:fixed;bottom:0;left:0;right:0;display:flex;gap:9px;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:#0b1020;border-top:1px solid #27334d}
input{flex:1;min-width:0;padding:14px;border-radius:24px;border:1px solid #35435e;background:#172239;color:white;font-size:16px;outline:none}
button{border:0;border-radius:50%;width:49px;min-width:49px;background:#3674f5;color:white;font-size:22px;cursor:pointer}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header>
<div class="logo">A</div>
<div><h2>ADRIX AI</h2><p>आपका AI असिस्टेंट</p></div>
</header>

<main id="chat" aria-live="polite">
<div class="welcome" id="welcome">
<div class="brain">✦</div>
<h1>नमस्ते! 👋</h1>
<p>मैं ADRIX हूँ। अपना सवाल नीचे लिखकर भेजें।</p>
</div>
</main>

<form id="form">
<input id="message" placeholder="कुछ भी पूछें..." autocomplete="off" required>
<button id="send" type="submit" aria-label="संदेश भेजें">➤</button>
</form>

<script>
"use strict";

const API_URL = "https://adrix-ai.onrender.com/chat";
const form = document.getElementById("form");
const input = document.getElementById("message");
const chat = document.getElementById("chat");
const send = document.getElementById("send");

function addMessage(text,type){
  const el=document.createElement("div");
  el.className="message "+type;
  el.textContent=text;
  chat.appendChild(el);
  chat.scrollTop=chat.scrollHeight;
  return el;
}

form.addEventListener("submit",async function(event){
  event.preventDefault();
  const text=input.value.trim();
  if(!text||send.disabled)return;

  document.getElementById("welcome")?.remove();
  addMessage(text,"user");
  input.value="";
  send.disabled=true;
  const waiting=addMessage("ADRIX जवाब सोच रहा है...","ai");

  try{
    const response=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text})
    });

    const data=await response.json();
    if(!response.ok)throw new Error(data.error||"सर्वर से जवाब नहीं मिला।");
    waiting.textContent=data.reply||"कोई जवाब नहीं मिला।";
  }catch(error){
    console.error(error);
    waiting.textContent=
      "कनेक्शन में समस्या है। इंटरनेट और Render सर्वर चेक करें।";
  }finally{
    send.disabled=false;
    input.focus();
  }
});
</script>
</body>
</html>
